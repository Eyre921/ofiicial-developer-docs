# AI 官方文档镜像 —— CNB 流水线
#
# 触发：
#   crontab     每天早晚黄金时间各拉一次（Asia/Shanghai 07:30 / 19:30）
#   api_trigger 手动触发（初始化 / 临时刷新用）
# 不配 push 触发：因为流水线自己会 commit 回仓库，配了 push 会 crawl→push→再触发 死循环。
#
# 省资源要点：cpus=2（纯下载/文本处理，IO 为主，多核无用）；内容无变化时不 commit。
main:
  "crontab: 30 7,19 * * *":
    - &refresh
      name: refresh-ai-docs
      runner:
        tags: cnb:arch:amd64
        cpus: 2
      docker:
        image: python:3.12-slim
      # 密钥仓：注入 GH_TOKEN 用于把 CNB 主仓镜像推到 github.com/Eyre921/ofiicial-developer-docs
      # imports 必须是列表 + 完整 blob URL（见 CNB 官方 file-reference 文档）
      # 密钥文件里 allow_events 需包含 crontab / api_trigger / web_trigger_refresh，
      # allow_slugs 需包含 lib/ofiicial-developer-docs（都已确认已加）。
      imports:
        - https://cnb.cool/eyre/secret/-/blob/main/external-registries.yml
      stages:
        - name: install-tools
          script: |
            apt-get update -qq
            apt-get install -y --no-install-recommends curl git ca-certificates >/dev/null
        - name: crawl
          script: |
            export CRAWL_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            export PYTHONUNBUFFERED=1   # 日志实时流出，方便看进度/定位卡住的源
            # PROVIDER 由网页按钮面板注入（不设=定时任务=抓全部）；INCLUDE_ALL_SDK_LANGUAGES 同理
            python -u crawl.py ${PROVIDER:-}
        - name: commit-back
          script: |
            git config user.name "cnb-docs-bot"
            git config user.email "docs-bot@cnb.cool"
            git add -A
            if git diff --cached --quiet; then
              echo "上游文档无变化，跳过提交（省资源）"
            else
              git commit -m "docs: refresh AI official docs mirror ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
              git remote set-url origin "https://cnb:${CNB_TOKEN}@cnb.cool/${CNB_REPO_SLUG}.git"
              git push origin "HEAD:${CNB_BRANCH}"
              echo "已提交并推送更新"
            fi
        - name: mirror-to-github
          # 把 CNB 主仓当前 HEAD 单向镜像推到 GitHub（force-push，GitHub 侧是纯镜像）。
          # 失败静默，不让 GitHub 抽风把整条流水线拉红（本职是抓文档并 commit 回 CNB，
          # GitHub 备份是 nice-to-have）。
          script: |
            if [ -z "${GH_TOKEN:-}" ]; then
              echo "跳过：GH_TOKEN 未注入。检查密钥仓 external-registries.yml 的"
              echo "  allow_events 是否包含当前触发事件"
              echo "  allow_slugs 是否包含 ${CNB_REPO_SLUG:-lib/ofiicial-developer-docs}"
              exit 0
            fi
            GH_REPO="Eyre921/ofiicial-developer-docs"
            GH_BRANCH="${CNB_BRANCH:-main}"
            git remote remove github 2>/dev/null || true
            git remote add github "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git"
            if git push -f github "HEAD:${GH_BRANCH}" 2>&1; then
              echo "✓ 已镜像到 github.com/${GH_REPO}@${GH_BRANCH}"
            else
              echo "⚠️ 镜像到 GitHub 失败（不影响本职抓取，CNB 主仓仍有全量）"
            fi
            # 顺便把所有 tag 也推过去（release stage 会用 v* tag）
            git push -f github --tags 2>/dev/null || true
            exit 0   # 强制成功，GitHub 侧任何异常都不阻断流水线
  api_trigger:
    - *refresh
  # 网页自定义按钮（.cnb/web_trigger.yml）点击后触发
  web_trigger_refresh:
    - *refresh
  # 每周日 20:00（Asia/Shanghai）打包 + 双端发 release + 清理旧版
  "crontab: 0 20 * * 0":
    - &weekly-release
      name: weekly-release
      runner:
        tags: cnb:arch:amd64
        cpus: 2
      docker:
        image: python:3.12-slim
      imports:
        - https://cnb.cool/eyre/secret/-/blob/main/external-registries.yml
      stages:
        - name: install-tools
          script: |
            apt-get update -qq
            apt-get install -y --no-install-recommends curl git ca-certificates jq >/dev/null
        - name: pack
          # 生成 dist/*.tar.gz 与 dist/manifest.json；version 用日期
          script: |
            export RELEASE_VERSION="$(date -u +%Y.%m.%d)"
            echo "$RELEASE_VERSION" > .release_version
            python -u release_pack.py >/dev/null
            ls -lh dist/
        - name: release-cnb
          # 用 git 打 tag 触发 CNB release；attachments 插件在下一阶段单独跑
          script: |
            VER="$(cat .release_version)"
            git config user.name "cnb-docs-bot"
            git config user.email "docs-bot@cnb.cool"
            git remote set-url origin "https://cnb:${CNB_TOKEN}@cnb.cool/${CNB_REPO_SLUG}.git"
            # 幂等：如果同名 tag 已存在（重跑），先删远端 tag
            git push origin ":refs/tags/v${VER}" 2>/dev/null || true
            git tag -f "v${VER}" -m "weekly release ${VER}"
            git push origin "v${VER}"
            echo "已推 tag v${VER}，CNB 会自动建 release 页"
        - name: upload-cnb-attachments
          image: cnbcool/attachments:latest
          settings:
            attachments:
              - dist/all.tar.gz
              - dist/ai-models.tar.gz
              - dist/agent-frameworks.tar.gz
              - dist/voice-multimodal.tar.gz
              - dist/vector-db.tar.gz
              - dist/coding-agents.tar.gz
              - dist/dev-platforms.tar.gz
              - dist/libraries.tar.gz
              - dist/manifest.json
        - name: release-github
          # 走 REST API 建 GitHub release + 上传 8 个 asset。失败静默不阻断。
          script: |
            if [ -z "${GH_TOKEN:-}" ]; then
              echo "跳过 GitHub release：GH_TOKEN 未注入"; exit 0
            fi
            VER="$(cat .release_version)"; TAG="v${VER}"
            REPO="Eyre921/ofiicial-developer-docs"
            API="https://api.github.com/repos/${REPO}"
            UPLOAD="https://uploads.github.com/repos/${REPO}"

            # 拿 CNB 侧刚 push 上去的 tag（GitHub 那边 mirror-to-github 是 branch push，tag 得单独推）
            git push -f "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "refs/tags/${TAG}" || {
              echo "⚠️ 推 tag 到 GitHub 失败"; exit 0
            }

            # 如同名 release 已存在，先删（幂等）
            existing_id=$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" \
              "${API}/releases/tags/${TAG}" | jq -r '.id // empty')
            if [ -n "$existing_id" ]; then
              curl -sS -X DELETE -H "Authorization: Bearer ${GH_TOKEN}" "${API}/releases/${existing_id}" >/dev/null
            fi

            # 建 release：JSON body 用 python 生成到临时文件，永远不踩 bash 字符串转义坑
            NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            TAG_CLEAN="$(echo -n "$TAG" | tr -d '[:space:]')"   # 防前后空白污染
            TAG="$TAG_CLEAN"
            python3 - "$TAG" "$NOW" > /tmp/release_body.json <<'PYEOF'
            import json, sys
            tag, now = sys.argv[1], sys.argv[2]
            body = (
                f"每周文档快照 · 生成时间 {now}\n\n"
                "8 个 asset：all.tar.gz 全站 + 7 个分类包 + manifest.json"
            )
            print(json.dumps({"tag_name": tag, "name": tag, "body": body}, ensure_ascii=False))
            PYEOF
            release_json=$(curl -sS -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Content-Type: application/json; charset=utf-8" \
              "${API}/releases" \
              --data-binary @/tmp/release_body.json)
            release_id=$(echo "$release_json" | jq -r '.id // empty')
            if [ -z "$release_id" ]; then
              echo "⚠️ 建 release 失败,响应体:"
              echo "$release_json" | head -30
              exit 0
            fi
            echo "✓ 建 release id=$release_id"

            # 上传 8 个包 + manifest
            for f in dist/*.tar.gz dist/manifest.json; do
              name=$(basename "$f")
              curl -sS -X POST \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Content-Type: application/octet-stream" \
                --data-binary "@$f" \
                "${UPLOAD}/releases/${release_id}/assets?name=${name}" \
                -o /dev/null -w "  uploaded $name (HTTP %{http_code})\n"
            done
            echo "✓ GitHub release ${TAG} 完成"
        - name: cleanup-old-releases
          # 两端都清：CNB + GitHub，各只留最近 4 个 v* release
          script: |
            KEEP=4

            # === CNB 侧清理（用 CNB API）===
            # 列出所有 tag（v* 前缀）按时间倒序，超出 KEEP 个的删掉
            echo "--- CNB 侧清理 ---"
            git fetch --tags origin 2>/dev/null || true
            # tag 按 committer date 倒排；取第 KEEP+1 起
            to_del_cnb=$(git for-each-ref --sort=-creatordate --format='%(refname:short)' refs/tags/v* 2>/dev/null | tail -n +$((KEEP+1)))
            for tag in $to_del_cnb; do
              echo "  删 CNB tag $tag"
              git push origin ":refs/tags/${tag}" || true
              # release 会随 tag 删除？如果没删，直接调 CNB API 删
              curl -sS -X DELETE \
                -H "Authorization: Bearer ${CNB_TOKEN}" \
                "https://api.cnb.cool/${CNB_REPO_SLUG}/-/releases/${tag}" >/dev/null 2>&1 || true
            done

            # === GitHub 侧清理 ===
            if [ -n "${GH_TOKEN:-}" ]; then
              echo "--- GitHub 侧清理 ---"
              REPO="Eyre921/ofiicial-developer-docs"
              # 拿 releases 列表，按 created_at 倒序，取超出 KEEP 的
              releases_json=$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" \
                "https://api.github.com/repos/${REPO}/releases?per_page=100")
              # 只处理 v* tag 的（避免误删手工发的）
              echo "$releases_json" | jq -r '.[] | select(.tag_name | startswith("v")) | "\(.id) \(.tag_name)"' | \
                tail -n +$((KEEP+1)) | while read id tag; do
                  echo "  删 GH release $tag (id=$id)"
                  curl -sS -X DELETE -H "Authorization: Bearer ${GH_TOKEN}" \
                    "https://api.github.com/repos/${REPO}/releases/${id}" || true
                  curl -sS -X DELETE -H "Authorization: Bearer ${GH_TOKEN}" \
                    "https://api.github.com/repos/${REPO}/git/refs/tags/${tag}" || true
                done
            fi
            exit 0
  api_trigger_release:
    - *weekly-release
