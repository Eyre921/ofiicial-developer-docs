# AI 官方文档镜像 —— CNB 流水线
#
# 触发：
#   crontab     每天早晚黄金时间各拉一次（Asia/Shanghai 07:30 / 19:30）
#   api_trigger 手动触发（初始化 / 临时刷新用）
# 不配 push 触发：因为流水线自己会 commit 回仓库，配了 push 会 crawl→push→再触发 死循环。
#
# 省资源要点：cpus=2（纯下载/文本处理，IO 为主，多核无用）；内容无变化时不 commit。
main:
  "crontab: 30 7,19 * * *":
    - &refresh
      name: refresh-ai-docs
      runner:
        tags: cnb:arch:amd64
        cpus: 2
      docker:
        image: python:3.12-slim
      # 密钥仓：GH_TOKEN 用于把 CNB 主仓镜像推到 github.com/Eyre921/ofiicial-developer-docs
      # imports 精确到文件（密钥仓禁本地 clone/网页 raw，只有流水线能展开）
      imports: https://cnb.cool/eyre/secret/-/blob/main/external-registries.yml
      stages:
        - name: install-tools
          script: |
            apt-get update -qq
            apt-get install -y --no-install-recommends curl git ca-certificates >/dev/null
        - name: crawl
          script: |
            export CRAWL_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            export PYTHONUNBUFFERED=1   # 日志实时流出，方便看进度/定位卡住的源
            # PROVIDER 由网页按钮面板注入（不设=定时任务=抓全部）；INCLUDE_ALL_SDK_LANGUAGES 同理
            python -u crawl.py ${PROVIDER:-}
        - name: commit-back
          script: |
            git config user.name "cnb-docs-bot"
            git config user.email "docs-bot@cnb.cool"
            git add -A
            if git diff --cached --quiet; then
              echo "上游文档无变化，跳过提交（省资源）"
            else
              git commit -m "docs: refresh AI official docs mirror ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
              git remote set-url origin "https://cnb:${CNB_TOKEN}@cnb.cool/${CNB_REPO_SLUG}.git"
              git push origin "HEAD:${CNB_BRANCH}"
              echo "已提交并推送更新"
            fi
        - name: mirror-to-github
          # 把 CNB 主仓当前 HEAD 单向镜像推到 GitHub（force-push，GitHub 侧是纯镜像）。
          # 失败静默，不让 GitHub 抽风把整条流水线拉红（本职是抓文档并 commit 回 CNB，
          # GitHub 备份是 nice-to-have）。
          script: |
            # 密钥仓的变量名探测（不打印值，只列名字，方便一次定位变量名）
            echo "--- 从密钥仓导入的候选变量名 ---"
            env | awk -F= '/^(GH|GITHUB|PAT|TOKEN|GHCR)/{print $1}' | sort -u

            # 兜底：优先 GH_TOKEN，其次 GITHUB_TOKEN / PAT / GHCR_TOKEN
            TOK="${GH_TOKEN:-${GITHUB_TOKEN:-${PAT:-${GHCR_TOKEN:-}}}}"
            if [ -z "$TOK" ]; then
              echo "跳过：密钥仓里没有识别到 GH 类 token（看上面变量列表补真名到脚本）"
              exit 0
            fi
            GH_REPO="Eyre921/ofiicial-developer-docs"
            GH_BRANCH="${CNB_BRANCH:-main}"
            git remote remove github 2>/dev/null || true
            git remote add github "https://x-access-token:${TOK}@github.com/${GH_REPO}.git"
            if git push -f github "HEAD:${GH_BRANCH}" 2>&1; then
              echo "✓ 已镜像到 github.com/${GH_REPO}@${GH_BRANCH}"
            else
              echo "⚠️ 镜像到 GitHub 失败（不影响本职抓取，已存在 CNB 主仓）"
            fi
            exit 0   # 强制成功，任何 GitHub 侧异常都不阻断流水线
  api_trigger:
    - *refresh
  # 网页自定义按钮（.cnb/web_trigger.yml）点击后触发
  web_trigger_refresh:
    - *refresh
